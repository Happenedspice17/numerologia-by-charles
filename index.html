<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2f6b">
<title>Numerología by Charles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: una sola columna tipo app. Tarjeta de perfil índigo arriba, pestañas (arriba en escritorio, barra inferior en el celular) y un panel visible a la vez. Paleta del curso: índigo, dorado tenue, gris piedra, blanco hueso. */
:root {
  --bg: #f4f1ea;
  --surface: #fffdf8;
  --surface-2: #ebe6da;
  --ink: #1d2140;
  --muted: #5d6070;
  --line: #dcd6c8;
  --indigo: #2b2f6b;
  --gold: #9a7628;
  --gold-soft: #f0e5c8;
  --vowel: #e5e1f5;
  --hero-bg: #2b2f6b;
  --hero-ink: #f4f1ea;
  --hero-muted: #c3c4e0;
  --hero-gold: #e2c27a;
  --ok: #2f6b4a;
  --warn: #965610;
  --bad: #a03535;
  --info: #3c4f8f;
  --shadow: 0 1px 2px rgb(29 33 64 / .06), 0 6px 18px rgb(29 33 64 / .07);
  --f-display: "Marcellus", "Cormorant Garamond", Georgia, serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --tab-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101226; --surface: #191c37; --surface-2: #22264a; --ink: #ece8dc; --muted: #a7a8bc; --line: #2e3258;
    --indigo: #bfc3f5; --gold: #dcbb6c; --gold-soft: #3a3220; --vowel: #2d2d58;
    --hero-bg: #22265a; --hero-ink: #f1ede2; --hero-muted: #b3b5d8; --hero-gold: #e6c67c;
    --ok: #82c9a0; --warn: #e6ad61; --bad: #ec8f8f; --info: #a3b3ee;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101226; --surface: #191c37; --surface-2: #22264a; --ink: #ece8dc; --muted: #a7a8bc; --line: #2e3258;
  --indigo: #bfc3f5; --gold: #dcbb6c; --gold-soft: #3a3220; --vowel: #2d2d58;
  --hero-bg: #22265a; --hero-ink: #f1ede2; --hero-muted: #b3b5d8; --hero-gold: #e6c67c;
  --ok: #82c9a0; --warn: #e6ad61; --bad: #ec8f8f; --info: #a3b3ee;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f-body); -webkit-tap-highlight-color: transparent; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; color: var(--indigo); }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
.sub { color: var(--muted); font-size: .82rem; }
button, input { font: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.app { max-width: 980px; margin: 0 auto; padding: 16px 20px 48px; display: grid; gap: 20px; }

/* Barra superior */
.barra-sup { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.marca { font-family: var(--f-display); font-size: 1.2rem; color: var(--indigo); display: flex; align-items: center; gap: 10px; }
.marca svg { width: 28px; height: 28px; fill: var(--gold); }
.tema { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font-size: .85rem; font-weight: 600; }
.tema svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.tema .i-sol, .tema .i-luna, .tema .i-auto { display: none; }
.tema[data-tema="claro"] .i-sol, .tema[data-tema="oscuro"] .i-luna, .tema[data-tema="sistema"] .i-auto { display: block; }

/* Perfil */
.perfil { position: relative; overflow: hidden; background: var(--hero-bg); color: var(--hero-ink); border-radius: 18px; padding: 22px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.perfil .tetractys { position: absolute; right: -18px; top: -14px; width: 150px; height: 150px; fill: var(--hero-gold); opacity: .16; pointer-events: none; }
.perfil-eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: .72rem; font-weight: 700; color: var(--hero-gold); }
.perfil h1 { color: var(--hero-ink); font-size: clamp(1.6rem, 6vw, 2.5rem); line-height: 1.1; position: relative; }
.perfil-meta { font-family: var(--f-num); font-size: .82rem; color: var(--hero-muted); }
.perfil-numeros { display: flex; gap: 10px; flex-wrap: wrap; }
.perfil-numeros span { display: grid; justify-items: center; min-width: 74px; padding: 8px 10px; border-radius: 12px; background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .14); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--hero-muted); }
.perfil-numeros b { font-family: var(--f-display); font-size: 1.9rem; line-height: 1.1; color: var(--hero-gold); font-weight: 400; letter-spacing: 0; }
.perfil-acciones { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn-claro { padding: 10px 16px; border-radius: 99px; border: 1px solid rgb(255 255 255 / .35); background: transparent; color: var(--hero-ink); font-weight: 700; cursor: pointer; }
.aviso { font-size: .82rem; color: var(--hero-muted); }
.aviso b { color: var(--hero-gold); }

form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; background: var(--surface); color: var(--ink); border-radius: 14px; padding: 16px; }
label { display: grid; gap: 4px; font-weight: 600; font-size: .88rem; }
label .sub { font-weight: 400; }
input { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); width: 100%; min-height: 46px; font-size: 16px; }
.btn-primario { grid-column: 1 / -1; padding: 14px; border: 0; border-radius: 12px; background: var(--indigo); color: var(--bg); font-weight: 700; cursor: pointer; }
.error { grid-column: 1 / -1; color: var(--bad); font-size: .9rem; }
.nota-form { grid-column: 1 / -1; font-size: .8rem; color: var(--muted); }

/* Pestañas */
#tabs-ancla { scroll-margin-top: env(safe-area-inset-top, 0px); }
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; gap: 4px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow-x: auto; scrollbar-width: none; }
.tabs a { flex: 1 0 auto; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 12px; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: .9rem; white-space: nowrap; }
.tabs svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs a[aria-current="page"] { background: var(--indigo); color: var(--bg); }

/* Paneles */
.panel-carta { display: grid; gap: 28px; min-width: 0; }
.bloque { display: grid; gap: 12px; min-width: 0; }
.bloque h3 { margin-top: 4px; }
.intro { color: var(--muted); font-size: .92rem; }
.formula, .nota, .leyenda { font-size: .82rem; color: var(--muted); }
.formula { font-family: var(--f-num); font-size: .76rem; line-height: 1.7; }
.chip { display: inline-block; font-family: var(--f-body); font-size: .7rem; font-weight: 700; padding: 1px 8px; border-radius: 99px; vertical-align: middle; }
.chip-maestro { background: var(--gold-soft); color: var(--gold); }
.chip-karma { background: var(--surface-2); color: var(--warn); }
details { font-size: .9rem; }
details > p, details > ul { margin-top: 8px; }
summary { cursor: pointer; color: var(--indigo); font-weight: 600; padding: 4px 0; }

/* Ahora mismo */
.ahora { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.ahora-item { display: grid; gap: 2px; align-content: start; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-size: .82rem; }
.ahora-item b { font-family: var(--f-display); font-size: 2.2rem; line-height: 1.05; color: var(--gold); font-weight: 400; }
.ahora-item b small { font-size: 1.2rem; color: var(--muted); }
.claves { list-style: none; margin: 0; padding: 0; display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-size: .9rem; }
.claves li { padding: 12px 14px; border-top: 1px solid var(--line); }
.claves li:first-child { border-top: 0; }
.claves b { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--gold); }

/* Medallones */
.medallones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: start; }
.medallon { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.med-cab { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
.cifra { font-family: var(--f-display); font-size: 2.6rem; line-height: 1; color: var(--gold); min-width: 1.4em; text-align: center; }
.med-tit { display: grid; min-width: 0; }
.med-nombre { font-family: var(--f-display); font-size: 1.05rem; color: var(--indigo); }
.arq { font-size: .82rem; color: var(--muted); font-weight: 600; }
.flecha { width: 20px; height: 20px; fill: none; stroke: var(--muted); stroke-width: 2; transition: transform .2s; }
.medallon.abierto .flecha { transform: rotate(180deg); }
.med-cuerpo { display: none; gap: 8px; padding: 0 14px 14px; font-size: .92rem; }
.medallon.abierto .med-cuerpo { display: grid; }
.pasos { font-family: var(--f-num); font-size: .78rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.karma { color: var(--warn); }

/* Nombre */
.tira { display: flex; flex-wrap: wrap; gap: 4px; }
.letra { display: grid; justify-items: center; width: 32px; padding: 5px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.letra.sep { margin-left: 12px; }
.letra span { font-family: var(--f-display); font-size: 1.05rem; }
.letra b { font-family: var(--f-num); font-size: .8rem; color: var(--gold); }
.letra.vocal { background: var(--vowel); }
.punto { display: inline-block; width: 10px; height: 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); vertical-align: middle; margin-left: 6px; }
.punto.vocal { background: var(--vowel); margin-left: 0; }
.tabla-letras p { font-family: var(--f-num); font-size: .8rem; }

.talentos { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.talento { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.talento p { grid-column: 1 / -1; font-size: .9rem; }
.t-num { font-family: var(--f-display); font-size: 1.8rem; line-height: 1; color: var(--gold); }
.t-puntos { display: flex; flex-wrap: wrap; gap: 4px; }
.t-puntos i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line); }
.t-puntos i.on { background: var(--gold); border-color: var(--gold); }
.estado { font-size: .72rem; font-weight: 700; padding: 2px 9px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.estado.saldado { color: var(--ok); }
.estado.talento { color: var(--info); }
.estado.deuda { color: var(--warn); }
.estado.omitido { color: var(--bad); }

.planos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.plano { display: grid; gap: 6px; align-content: start; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.plano p { font-size: .9rem; }
.plano-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.plano-val { font-family: var(--f-display); font-size: 2rem; line-height: 1; color: var(--gold); }
.barra { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--gold); border-radius: 3px; }

/* Cuadro */
.cuadro-wrap { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 24px; align-items: start; }
.cuadro-col { display: grid; gap: 8px; }
.cuadro { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px; }
.planos-lado { display: grid; grid-template-rows: repeat(3, 1fr); font-size: .65rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); writing-mode: vertical-rl; transform: rotate(180deg); }
.planos-lado span { display: grid; place-items: center; }
.rejilla { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); aspect-ratio: 1; max-width: 100%; border: 2px solid var(--indigo); border-radius: 10px; overflow: hidden; background: var(--surface); }
.celda { position: relative; display: grid; place-items: center; border: 1px solid var(--line); font-family: var(--f-num); font-size: 1.15rem; word-break: break-all; text-align: center; padding: 4px; }
.celda.vacia b { color: var(--line); }
.celda .idx { position: absolute; top: 4px; left: 6px; font-size: .62rem; color: var(--muted); }
.rejilla svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.rejilla line { stroke-width: 7; stroke-linecap: round; opacity: .5; }
.rejilla line.llena { stroke: var(--gold); }
.rejilla line.vacia { stroke: var(--bad); stroke-dasharray: 2 13; opacity: .75; }
.trazo { display: inline-block; width: 22px; height: 4px; border-radius: 2px; vertical-align: middle; }
.trazo.llena { background: var(--gold); }
.trazo.vacia { background: repeating-linear-gradient(90deg, var(--bad) 0 3px, transparent 3px 7px); margin-left: 8px; }
.cuadro-txt { display: grid; gap: 10px; min-width: 0; }
.saetas, .det, .letras { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: .9rem; }
.saetas li { padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--gold); }
.saetas li.vacia { border-left-color: var(--bad); }
.saetas p { margin-top: 4px; }
.det li { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); gap: 10px; align-items: baseline; }
.det b { font-family: var(--f-num); color: var(--gold); word-break: break-all; }

/* Etapas */
.linea-vida { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.etapa { position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 14px; padding-bottom: 18px; }
.etapa::before { content: ""; position: absolute; left: 17px; top: 36px; bottom: 0; width: 2px; background: var(--line); }
.etapa:last-child::before { display: none; }
.nodo { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); font-family: var(--f-display); color: var(--muted); z-index: 1; }
.etapa.actual .nodo { background: var(--gold); border-color: var(--gold); color: var(--bg); }
.etapa-cuerpo { display: grid; gap: 8px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-size: .9rem; }
.etapa.actual .etapa-cuerpo { border: 2px solid var(--gold); }
.rango { font-family: var(--f-num); font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.par { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.par div { display: grid; }
.par b { font-family: var(--f-display); font-size: 2rem; line-height: 1.1; color: var(--gold); font-weight: 400; }
.par em { font-style: normal; font-size: .78rem; color: var(--muted); }
.desafio-txt { color: var(--warn); }
.ahora-item b.dnum, .par b.dnum { font-family: var(--f-num); font-size: 1.7rem; line-height: 1.3; }

/* Ciclos */
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.trio > div { display: grid; gap: 4px; align-content: start; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-size: .9rem; }
.trio b { font-family: var(--f-display); font-size: 2.3rem; line-height: 1; color: var(--gold); font-weight: 400; }
.fila-meses { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px; }
.mes { display: grid; justify-items: center; padding: 8px 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.mes span { font-size: .72rem; color: var(--muted); }
.mes b { font-family: var(--f-num); font-size: 1.1rem; }
.mes.actual { border-color: var(--gold); background: var(--gold-soft); }

/* Natalicio */
.letras li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.letra-grande { font-family: var(--f-display); font-size: 1.8rem; line-height: 1; color: var(--gold); font-weight: 400; margin-right: 6px; }

/* Celular */
@media (max-width: 720px) {
  .app { padding: 12px 16px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom, 0px)); gap: 16px; }
  .tabs { position: fixed; top: auto; left: 0; right: 0; bottom: 0; border-radius: 0; border: 0; border-top: 1px solid var(--line); padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)); gap: 0; overflow: visible; }
  .tabs a { flex: 1 1 0; flex-direction: column; gap: 2px; padding: 6px 2px; font-size: .66rem; min-height: 54px; min-width: 0; }
  .tabs svg { width: 22px; height: 22px; }
  .tabs a[aria-current="page"] { background: none; color: var(--gold); }
  .tabs a[aria-current="page"] svg { stroke-width: 2.2; }
  form { grid-template-columns: minmax(0, 1fr); }
  .perfil { padding: 18px; }
  .medallones, .planos { grid-template-columns: minmax(0, 1fr); }
  .ahora { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .trio { grid-template-columns: minmax(0, 1fr); }
  .trio > div { grid-template-columns: auto minmax(0, 1fr); column-gap: 14px; }
  .trio > div .sub { grid-column: 1 / -1; }
  .trio > div b { grid-row: 2; }
  .cuadro-wrap { grid-template-columns: minmax(0, 1fr); }
  .cuadro { max-width: 340px; width: 100%; margin: 0 auto; }
  .fila-meses { grid-template-columns: repeat(6, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .flecha { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="barra-sup">
    <span class="marca">
      <svg viewBox="0 0 40 36" aria-hidden="true"><circle cx="20" cy="4" r="3"/><circle cx="14" cy="13" r="3"/><circle cx="26" cy="13" r="3"/><circle cx="8" cy="22" r="3"/><circle cx="20" cy="22" r="3"/><circle cx="32" cy="22" r="3"/><circle cx="2.5" cy="31" r="2.5"/><circle cx="14" cy="31" r="3"/><circle cx="26" cy="31" r="3"/><circle cx="37.5" cy="31" r="2.5"/></svg>
      Numerología by Charles
    </span>
    <button class="tema" id="tema" type="button" data-tema="sistema">
      <svg class="i-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
      <svg class="i-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg>
      <span class="tema-txt">Automático</span>
    </button>
  </div>

  <section class="perfil" aria-label="Datos de la carta">
    <svg class="tetractys" viewBox="0 0 40 36" aria-hidden="true"><circle cx="20" cy="4" r="3"/><circle cx="14" cy="13" r="3"/><circle cx="26" cy="13" r="3"/><circle cx="8" cy="22" r="3"/><circle cx="20" cy="22" r="3"/><circle cx="32" cy="22" r="3"/><circle cx="2.5" cy="31" r="2.5"/><circle cx="14" cy="31" r="3"/><circle cx="26" cy="31" r="3"/><circle cx="37.5" cy="31" r="2.5"/></svg>
    <span class="perfil-eyebrow">Carta numerológica</span>
